<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27" />
      <stop offset="100%" stop-color="#050818" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with slightly rounded look inside the canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  
  <!-- Outer glowing circle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f2fe" stroke-width="10" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="15 20" />

  <!-- Monogram "J" in a custom geometric futuristic shape -->
  <!-- Starts top right, goes down, loops left and up -->
  <path d="M 310 140 L 310 320 C 310 375 265 410 200 410 C 145 410 110 375 110 330 L 165 330 C 165 352 180 365 200 365 C 235 365 252 345 252 315 L 252 140 Z" fill="#00f2fe" filter="url(#glow)" />
  
  <!-- Tiny decorative cyan-magenta points -->
  <circle cx="310" cy="140" r="8" fill="#00f2fe" />
  <circle cx="110" cy="330" r="6" fill="#ec4899" filter="url(#glow)" />
</svg>
